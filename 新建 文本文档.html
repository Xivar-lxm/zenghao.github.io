<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>饮水记录 - 健康饮水助手</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            width: 640px;
            height: 1030px;
            margin: 0 auto;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
            color: white;
            overflow: hidden;
        }
        
        .container {
            padding: 20px;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .week-chart {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .chart-bar {
            display: flex;
            align-items: end;
            justify-content: space-between;
            height: 200px;
            margin-top: 20px;
        }
        
        .bar {
            width: 40px;
            background: #00cec9;
            border-radius: 8px 8px 0 0;
            position: relative;
        }
        
        .bar-label {
            position: absolute;
            bottom: -25px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 12px;
        }
        
        .history-list {
            flex: 1;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px;
            overflow-y: auto;
        }
        
        .record-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        
        .footer-nav {
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            margin-top: 10px;
        }
        
        .nav-item {
            color: white;
            text-decoration: none;
            text-align: center;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 饮水记录</h1>
            <p>本周饮水统计</p >
        </div>
        
        <div class="week-chart">
            <h3>本周完成情况</h3>
            <div class="chart-bar">
                <!-- 柱状图数据 -->
                <div class="bar" style="height: 80%;">
                    <div class="bar-label">一</div>
                </div>
                <div class="bar" style="height: 95%;">
                    <div class="bar-label">二</div>
                </div>
                <div class="bar" style="height: 65%;">
                    <div class="bar-label">三</div>
                </div>
                <div class="bar" style="height: 100%;">
                    <div class="bar-label">四</div>
                </div>
                <div class="bar" style="height: 75%;">
                    <div class="bar-label">五</div>
                </div>
                <div class="bar" style="height: 90%;">
                    <div class="bar-label">六</div>
                </div>
                <div class="bar" style="height: 50%;">
                    <div class="bar-label">日</div>
                </div>
            </div>
        </div>
        
        <div class="history-list">
            <h3>今日记录</h3>
            <div class="record-item">
                <span>🥛 08:30</span>
                <span>+200ml</span>
            </div>
            <div class="record-item">
                <span>🍶 10:15</span>
                <span>+300ml</span>
            </div>
            <div class="record-item">
                <span>🍺 12:00</span>
                <span>+500ml</span>
            </div>
            <div class="record-item">
                <span>🥛 14:30</span>
                <span>+200ml</span>
            </div>
            <div class="record-item">
                <span>🍶 16:45</span>
                <span>+300ml</span>
            </div>
        </div>
        
        <div class="footer-nav">
            <a href=" " class="nav-item">🏠 首页</a >
            <a href="history.html" class="nav-item">📊 记录</a >
            <a href="settings.html" class="nav-item">⚙️ 设置</a >
        </div>
    </div>
</body>
</html>
